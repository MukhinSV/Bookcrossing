<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Книга</title>
  <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
  <link rel="stylesheet" href="/static/app.css">
  <style>
    body {
      min-height: 100vh;
    }
    .book-cover {
      width: 100%;
      max-width: 220px;
      height: auto;
      object-fit: contain;
      border-radius: 0.75rem;
      border: 1px solid var(--border);
      background: #fff;
      display: block;
      margin: 0 auto;
    }
    #book-info .book-cover {
      margin-bottom: 1.25rem;
    }
    .book-title-row {
      display: flex;
      align-items: center;
      gap: .5rem;
      flex-wrap: wrap;
      margin-bottom: .5rem;
    }
    .book-status-badge {
      width: 1.95rem;
      height: 1.95rem;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border-radius: 999px;
      font-size: 1.08rem;
      font-weight: 800;
      line-height: 1;
      color: #fff;
      border: 2px solid rgba(255, 255, 255, .95);
      box-shadow: 0 6px 14px rgba(0, 0, 0, .22);
      text-shadow: 0 1px 1px rgba(0, 0, 0, .25);
    }
    .book-status-badge svg {
      width: 1.1rem;
      height: 1.1rem;
      display: block;
      stroke: currentColor;
      fill: none;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    .book-status-badge.booked {
      background: #2563eb;
    }
    .book-status-badge.owned {
      background: #16a34a;
    }
    .site-footer {
      background: var(--bg-solid);
      border-top: 1px solid var(--border);
      color: var(--text-muted);
    }
    .site-footer .muted {
      color: var(--text-muted);
    }
  </style>
</head>
<body class="bg-light d-flex flex-column">
  <main class="container py-4 py-md-5 flex-grow-1">
    <div class="d-flex justify-content-between align-items-center mb-4">
      <h1 class="h3 mb-0">Карточка книги</h1>
      <div class="d-flex gap-2">
        <button id="back-btn" type="button" class="btn btn-outline-secondary">Назад</button>
      </div>
    </div>

    <div id="result" class="mb-3" role="status"></div>

    <section class="card shadow-sm mb-4">
      <div class="card-body" id="book-info">
        <p class="text-muted mb-0">Загрузка информации о книге...</p>
      </div>
    </section>

    <section class="card shadow-sm">
      <div class="card-header fw-semibold">Действия</div>
      <div class="card-body">
        <div id="actions-area"></div>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container py-4 small muted">
      © Bookcrossing. Читайте, делитесь, возвращайте книги в оборот.
    </div>
  </footer>

  <script src="/static/app.js"></script>
  <script>
    const result = document.getElementById("result");
    const bookInfo = document.getElementById("book-info");
    const actionsArea = document.getElementById("actions-area");
    const backBtn = document.getElementById("back-btn");
    let resultTimer;
    let contextData = null;

    function getBookIdFromPath() {
      const parts = window.location.pathname.split("/").filter(Boolean);
      const bookIndex = parts.indexOf("book");
      if (bookIndex === -1 || bookIndex + 1 >= parts.length) {
        return null;
      }
      return Number(parts[bookIndex + 1]);
    }

    function showSideToast(type, message, timeoutMs = 4000) {
      const existingStack = document.getElementById("page-toast-stack");
      const stack = existingStack ?? (() => {
        const element = document.createElement("div");
        element.id = "page-toast-stack";
        Object.assign(element.style, {
          position: "fixed",
          top: ".8rem",
          right: window.innerWidth <= 699 ? ".8rem" : "1rem",
          left: window.innerWidth <= 699 ? ".8rem" : "auto",
          width: window.innerWidth <= 699 ? "auto" : "min(360px, calc(100vw - 2rem))",
          zIndex: "1300",
          display: "flex",
          flexDirection: "column",
          gap: ".75rem",
          pointerEvents: "none",
          transform: "none",
        });
        document.body.appendChild(element);
        return element;
      })();
      const accentColor = {success:"var(--success)",danger:"var(--danger)",warning:"var(--warning)",info:"var(--primary)",secondary:"var(--border-strong)"}[type] || "var(--primary)";
      const iconText = {success:"✓",danger:"!",warning:"•",info:"i",secondary:"•"}[type] || "i";
      const titleText = {success:"Готово",danger:"Ошибка",warning:"Внимание",info:"Сообщение",secondary:"Сообщение"}[type] || "Сообщение";
      const toast = document.createElement("div");
      Object.assign(toast.style, {pointerEvents:"auto",border:"1px solid var(--border)",borderRadius:"16px",background:"color-mix(in srgb, var(--bg-elevated) 92%, transparent)",backdropFilter:"blur(16px)",boxShadow:"0 18px 34px rgba(15, 23, 42, 0.18)",overflow:"hidden",transform:"translateX(24px)",opacity:"0",transition:"transform .22s ease, opacity .22s ease"});
      const body = document.createElement("div");
      Object.assign(body.style, {display:"flex",alignItems:"flex-start",gap:".75rem",padding:".9rem .95rem 1rem",position:"relative"});
      const accent = document.createElement("div");
      Object.assign(accent.style, {position:"absolute",top:"0",left:"0",right:"0",height:"3px",background:accentColor});
      const icon = document.createElement("div");
      icon.textContent = iconText;
      Object.assign(icon.style, {width:"2rem",height:"2rem",borderRadius:"999px",display:"inline-flex",alignItems:"center",justifyContent:"center",flexShrink:"0",fontSize:".95rem",fontWeight:"800",color:"#fff",background:accentColor});
      const content = document.createElement("div");
      Object.assign(content.style, {minWidth:"0",flex:"1 1 auto"});
      const title = document.createElement("div");
      title.textContent = titleText;
      Object.assign(title.style, {fontSize:".84rem",fontWeight:"700",marginBottom:".18rem",color:"var(--text)"});
      const text = document.createElement("div");
      text.textContent = String(message);
      Object.assign(text.style, {fontSize:".92rem",lineHeight:"1.4",color:"var(--text)",overflowWrap:"anywhere"});
      const close = document.createElement("button");
      close.type = "button";
      close.textContent = "×";
      Object.assign(close.style, {border:"0",background:"transparent",color:"var(--text-muted)",padding:"0",width:"1.5rem",height:"1.5rem",borderRadius:"999px",cursor:"pointer",flexShrink:"0",fontSize:"1rem",lineHeight:"1"});
      function removeToast() { if (!toast.isConnected) return; toast.style.transform = "translateX(24px)"; toast.style.opacity = "0"; setTimeout(() => toast.remove(), 220); }
      close.addEventListener("click", removeToast);
      content.appendChild(title); content.appendChild(text);
      body.appendChild(accent); body.appendChild(icon); body.appendChild(content); body.appendChild(close);
      toast.appendChild(body); stack.appendChild(toast);
      requestAnimationFrame(() => { toast.style.transform = "translateX(0)"; toast.style.opacity = "1"; });
      if (timeoutMs > 0) setTimeout(removeToast, timeoutMs);
    }

    function showResult(type, message, timeoutMs = 4000) {
      showSideToast(type, message, timeoutMs);
    }

    function renderBookInfo(book) {
      if (!book) {
        bookInfo.innerHTML = '<p class="text-danger mb-0">Книга не найдена</p>';
        return;
      }
      const imageSrc = resolveBookImage(book.image);
      const statusBadge = getBookStatusBadge(book);
      bookInfo.innerHTML = `
        <div class="row g-3 align-items-start">
          <div class="col-12 col-md-auto">
            <img src="${imageSrc}" alt="${book.title ?? "Обложка книги"}" class="book-cover">
          </div>
          <div class="col">
            <div class="book-title-row">
              <h2 class="h5 mb-0">${book.title ?? "-"}</h2>
              ${statusBadge}
            </div>
            <p class="mb-1"><strong>Автор:</strong> ${book.author?.fullname ?? "-"}</p>
            <p class="mb-1"><strong>Жанр:</strong> ${book.genre ?? "-"}</p>
            <p class="mb-1"><strong>Год:</strong> ${book.year ?? "-"}</p>
            <p class="mb-0"><strong>Описание:</strong> ${book.description ?? "-"}</p>
          </div>
        </div>
      `;
    }

    function getBookStatusBadge(book) {
      if (book?.is_booked_by_user) {
        return '<span class="book-status-badge booked" title="Книга забронирована вами" aria-label="Книга забронирована вами"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4.75h10a1.25 1.25 0 0 1 1.25 1.25v13.25l-6.25-3.5-6.25 3.5V6A1.25 1.25 0 0 1 7 4.75Z"/></svg></span>';
      }
      if (book?.is_owned_by_user) {
        return '<span class="book-status-badge owned" title="Книга у вас" aria-label="Книга у вас"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6.75 12.5 3.5 3.5 7-7.5"/></svg></span>';
      }
      return "";
    }

    function resolveBookImage(imageValue) {
      if (!imageValue) {
        return "/imgs/default-book.jpg";
      }
      if (imageValue.startsWith("http://") || imageValue.startsWith("https://") || imageValue.startsWith("/")) {
        return imageValue;
      }
      return `/imgs/${imageValue}`;
    }

    async function handleBooking(bookId, instanceId) {
      try {
        const response = await fetch(`/book/${bookId}/booking/${instanceId}`, {
          method: "POST"
        });
        const data = await response.json();
        if (!response.ok) {
          showResult("danger", data.detail ? String(data.detail) : "Не удалось забронировать книгу");
          return;
        }
        showResult("success", "Книга успешно забронирована");
        setTimeout(() => {
          window.location.href = "/profile/view";
        }, 700);
      } catch (error) {
        showResult("danger", "Ошибка запроса");
      }
    }

    async function handlePickup(bookId, instanceId) {
      try {
        const response = await fetch(`/book/${bookId}/pickup/${instanceId}`, {
          method: "POST"
        });
        const data = await response.json();
        if (!response.ok) {
          showResult("danger", data.detail ? String(data.detail) : "Не удалось забрать книгу");
          return;
        }
        showResult("success", "Книга добавлена во взятые");
        setTimeout(() => {
          window.location.href = "/profile/view";
        }, 700);
      } catch (error) {
        showResult("danger", "Ошибка запроса");
      }
    }

    function renderActions(bookId, context) {
      const instances = context.instances;
      const booking = context.booking;
      const exchangePoints = context.exchanges_point;
      const book = context.book;

      if (book?.is_owned_by_user) {
        actionsArea.innerHTML = `
          <div class="alert alert-success mb-0">
            Эта книга уже находится у вас. Она доступна в разделе "Взятые книги" в личном кабинете.
          </div>
        `;
        return;
      }

      if (booking) {
        actionsArea.innerHTML = `
          <div class="alert alert-info mb-0">
            Книга уже забронирована. Перейдите в личный кабинет.
          </div>
        `;
        return;
      }

      if (!instances) {
        actionsArea.innerHTML = `
          <div class="alert alert-secondary mb-0">
            Нет доступных книг
          </div>
        `;
        return;
      }

      actionsArea.innerHTML = `
        <div>
          <label for="exchange-select" class="form-label">Выберите адрес получения</label>
          <select id="exchange-select" class="form-select mb-3"></select>
          <div class="d-flex flex-wrap gap-2">
            <button id="confirm-booking-btn" type="button" class="btn btn-primary">
              Забронировать
            </button>
            <button id="pickup-book-btn" type="button" class="btn btn-success">
              Уже забрал
            </button>
          </div>
        </div>
      `;

      const pickupBookBtn = document.getElementById("pickup-book-btn");
      const exchangeSelect = document.getElementById("exchange-select");
      const confirmBookingBtn = document.getElementById("confirm-booking-btn");

      const points = Array.isArray(exchangePoints) ? exchangePoints : [];
      const sourcePoints = points.length ? points : instances.map((instance) => ({
        id: instance.exchange_point_id,
        address: "Адрес не указан"
      }));

      sourcePoints.forEach((point) => {
        const option = document.createElement("option");
        option.value = String(point.id);
        option.textContent = point.address ?? "Адрес не указан";
        exchangeSelect.appendChild(option);
      });

      pickupBookBtn.addEventListener("click", () => {
        const selectedExchangePointId = Number(exchangeSelect.value);
        const selectedInstance = instances.find((instance) => (
          instance.exchange_point_id === selectedExchangePointId
        )) ?? instances[0];

        if (!selectedInstance) {
          showResult("danger", "Свободных экземпляров не найдено");
          return;
        }

        handlePickup(bookId, selectedInstance.id);
      });

      confirmBookingBtn.addEventListener("click", () => {
        const selectedExchangePointId = Number(exchangeSelect.value);
        const selectedInstance = instances.find((instance) => (
          instance.exchange_point_id === selectedExchangePointId
        )) ?? instances[0];

        if (!selectedInstance) {
          showResult("danger", "Свободных экземпляров не найдено");
          return;
        }

        handleBooking(bookId, selectedInstance.id);
      });
    }

    async function loadBookPage() {
      const bookId = getBookIdFromPath();
      if (!bookId) {
        showResult("danger", "Некорректный идентификатор книги");
        return;
      }

      // showResult("info", "Загрузка...", 0);
      try {
        const response = await fetch(`/book/${bookId}`, {
          method: "GET",
          headers: {"Accept": "application/json"}
        });
        const data = await response.json();
        if (!response.ok) {
          // showResult("danger", data.detail ? String(data.detail) : "Не удалось загрузить данные");
          return;
        }

        contextData = data;
        renderBookInfo(data.book);
        renderActions(bookId, data);
        // showResult("success", "Данные загружены");
      } catch (error) {
        // showResult("danger", "Ошибка загрузки");
      }
    }

    backBtn.addEventListener("click", () => {
      if (window.history.length > 1) {
        window.history.back();
      } else {
        window.location.href = "/main/view";
      }
    });

    loadBookPage();
  </script>
</body>
</html>
