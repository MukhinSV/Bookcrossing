<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Статистика</title>
  <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
  <link rel="stylesheet" href="/static/app.css">
  <style>
    body {
      min-height: 100vh;
      background: var(--bg);
    }
    .stat-card {
      border: 1px solid var(--border);
      border-radius: 1.1rem;
      background: color-mix(in srgb, var(--surface) 90%, transparent);
      backdrop-filter: blur(16px);
      box-shadow: var(--shadow);
      height: 100%;
    }
    .stat-number {
      font-size: 2rem;
      font-weight: 700;
      line-height: 1;
    }
    .org-list {
      margin: 0;
      padding-left: 1.1rem;
    }
    .org-list li + li {
      margin-top: .45rem;
    }
    @media (max-width: 991.98px) {
      .stats-org-column {
        margin-top: 1.2rem;
      }
    }
  </style>
</head>
<body class="bg-light d-flex flex-column">
  <main class="container py-4 py-md-5 flex-grow-1">
    <div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-2">
      <div>
        <h1 class="h3 mb-1">Статистика сайта</h1>
        <p class="text-muted mb-0">Сводка по основным метрикам Bookcrossing</p>
      </div>
      <div class="d-flex gap-2" data-mobile-menu>
        <a href="/admin/view" class="btn btn-outline-secondary">Админ-панель</a>
        <a href="/main/view" class="btn btn-outline-secondary">На главную</a>
      </div>
    </div>

    <div id="result" class="mb-3" role="status"></div>

    <section class="row g-3 mb-4">
      <div class="col-12 col-md-4">
        <article class="stat-card p-4">
          <div class="text-muted mb-2">Пользователи</div>
          <div id="users-total" class="stat-number">0</div>
        </article>
      </div>
      <div class="col-12 col-md-4">
        <article class="stat-card p-4">
          <div class="text-muted mb-2">Доступные книги</div>
          <div id="instances-total" class="stat-number">0</div>
        </article>
      </div>
      <div class="col-12 col-md-4">
        <article class="stat-card p-4">
          <div class="text-muted mb-2">Учебные заведения</div>
          <div id="organisations-total" class="stat-number">0</div>
        </article>
      </div>
    </section>

    <section class="row g-3">
      <div class="col-12 col-lg-7">
        <article class="stat-card p-3 p-md-4">
          <h2 class="h5 mb-3">Сравнение основных показателей</h2>
          <canvas id="totals-chart" height="120"></canvas>
        </article>
      </div>
      <div class="col-12 col-lg-5 stats-org-column">
        <article class="stat-card p-3 p-md-4">
          <h2 class="h5 mb-3">Уже сотрудничаем с</h2>
          <ul id="org-list" class="org-list">
            <li class="text-muted">Загрузка...</li>
          </ul>
        </article>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container py-4 small muted">
      © Bookcrossing Admin
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>
  <script src="/static/app.js"></script>
  <script>
    const result = document.getElementById("result");
    const usersTotal = document.getElementById("users-total");
    const instancesTotal = document.getElementById("instances-total");
    const organisationsTotal = document.getElementById("organisations-total");
    const orgList = document.getElementById("org-list");
    let resultTimer;

    function showSideToast(type, message, timeoutMs = 4000) {
      const existingStack = document.getElementById("page-toast-stack");
      const stack = existingStack ?? (() => {
        const element = document.createElement("div");
        element.id = "page-toast-stack";
        Object.assign(element.style, {
          position: "fixed",
          top: ".8rem",
          right: window.innerWidth <= 699 ? ".8rem" : "1rem",
          left: window.innerWidth <= 699 ? ".8rem" : "auto",
          width: window.innerWidth <= 699 ? "auto" : "min(360px, calc(100vw - 2rem))",
          zIndex: "1300",
          display: "flex",
          flexDirection: "column",
          gap: ".75rem",
          pointerEvents: "none",
          transform: "none",
        });
        document.body.appendChild(element);
        return element;
      })();
      const accentColor = {success:"var(--success)",danger:"var(--danger)",warning:"var(--warning)",info:"var(--primary)",secondary:"var(--border-strong)"}[type] || "var(--primary)";
      const iconText = {success:"✓",danger:"!",warning:"•",info:"i",secondary:"•"}[type] || "i";
      const titleText = {success:"Готово",danger:"Ошибка",warning:"Внимание",info:"Сообщение",secondary:"Сообщение"}[type] || "Сообщение";
      const toast = document.createElement("div");
      Object.assign(toast.style, {pointerEvents:"auto",border:"1px solid var(--border)",borderRadius:"16px",background:"color-mix(in srgb, var(--bg-elevated) 92%, transparent)",backdropFilter:"blur(16px)",boxShadow:"0 18px 34px rgba(15, 23, 42, 0.18)",overflow:"hidden",transform:"translateX(24px)",opacity:"0",transition:"transform .22s ease, opacity .22s ease"});
      const body = document.createElement("div");
      Object.assign(body.style, {display:"flex",alignItems:"flex-start",gap:".75rem",padding:".9rem .95rem 1rem",position:"relative"});
      const accent = document.createElement("div");
      Object.assign(accent.style, {position:"absolute",top:"0",left:"0",right:"0",height:"3px",background:accentColor});
      const icon = document.createElement("div");
      icon.textContent = iconText;
      Object.assign(icon.style, {width:"2rem",height:"2rem",borderRadius:"999px",display:"inline-flex",alignItems:"center",justifyContent:"center",flexShrink:"0",fontSize:".95rem",fontWeight:"800",color:"#fff",background:accentColor});
      const content = document.createElement("div");
      Object.assign(content.style, {minWidth:"0",flex:"1 1 auto"});
      const title = document.createElement("div");
      title.textContent = titleText;
      Object.assign(title.style, {fontSize:".84rem",fontWeight:"700",marginBottom:".18rem",color:"var(--text)"});
      const text = document.createElement("div");
      text.textContent = String(message);
      Object.assign(text.style, {fontSize:".92rem",lineHeight:"1.4",color:"var(--text)",overflowWrap:"anywhere"});
      const close = document.createElement("button");
      close.type = "button";
      close.textContent = "×";
      Object.assign(close.style, {border:"0",background:"transparent",color:"var(--text-muted)",padding:"0",width:"1.5rem",height:"1.5rem",borderRadius:"999px",cursor:"pointer",flexShrink:"0",fontSize:"1rem",lineHeight:"1"});
      function removeToast() { if (!toast.isConnected) return; toast.style.transform = "translateX(24px)"; toast.style.opacity = "0"; setTimeout(() => toast.remove(), 220); }
      close.addEventListener("click", removeToast);
      content.appendChild(title); content.appendChild(text);
      body.appendChild(accent); body.appendChild(icon); body.appendChild(content); body.appendChild(close);
      toast.appendChild(body); stack.appendChild(toast);
      requestAnimationFrame(() => { toast.style.transform = "translateX(0)"; toast.style.opacity = "1"; });
      if (timeoutMs > 0) setTimeout(removeToast, timeoutMs);
    }

    function showResult(type, message, timeoutMs = 4000) {
      showSideToast(type, message, timeoutMs);
    }

    function renderCharts(data) {
      const totals = data.totals || {};
      const names = Array.isArray(data.organisations_names) ? data.organisations_names : [];

      usersTotal.textContent = String(totals.users || 0);
      instancesTotal.textContent = String(totals.instances || 0);
      organisationsTotal.textContent = String(totals.organisations || 0);

      if (names.length === 0) {
        orgList.innerHTML = '<li class="text-muted">Пока нет организаций</li>';
      } else {
        orgList.innerHTML = names.map((name) => `<li>${name}</li>`).join("");
      }

      const rootStyles = getComputedStyle(document.documentElement);
      const textMuted = rootStyles.getPropertyValue("--text-muted").trim() || "#6b7280";
      const border = rootStyles.getPropertyValue("--border").trim() || "#d1d5db";

      new Chart(document.getElementById("totals-chart"), {
        type: "bar",
        data: {
          labels: ["Пользователи", "Доступные книги"],
          datasets: [{
            label: "Количество",
            data: [totals.users || 0, totals.instances || 0],
            backgroundColor: ["#4f7cff", "#4fbf92"],
            borderRadius: 8
          }]
        },
        options: {
          responsive: true,
          plugins: {
            legend: {display: false}
          },
          scales: {
            x: {
              ticks: {color: textMuted},
              grid: {color: border}
            },
            y: {
              beginAtZero: true,
              ticks: {precision: 0, color: textMuted},
              grid: {color: border}
            }
          }
        }
      });
    }

    async function loadStats() {
      try {
        const response = await fetch("/admin/stats/data", {
          method: "GET",
          headers: {"Accept": "application/json"}
        });
        const data = await response.json();
        if (!response.ok) {
          showResult("danger", data.detail ? String(data.detail) : "Не удалось загрузить статистику");
          return;
        }
        renderCharts(data);
      } catch (error) {
        showResult("danger", "Ошибка загрузки статистики");
      }
    }

    loadStats();
  </script>
</body>
</html>
