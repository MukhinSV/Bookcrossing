<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Добавить книгу</title>
  <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
  <link rel="stylesheet" href="/static/app.css">
  <style>
    body {
      min-height: 100vh;
    }
    .site-footer {
      background: var(--bg-solid);
      border-top: 1px solid var(--border);
      color: var(--text-muted);
    }
    .site-footer .muted {
      color: var(--text-muted);
    }
  </style>
</head>
<body class="bg-light d-flex flex-column">
  <main class="container py-4 py-md-5 flex-grow-1">
    <div class="d-flex align-items-center justify-content-between mb-4 flex-wrap gap-2">
      <h1 class="h3 mb-0">Отдать книгу</h1>
      <div class="d-flex gap-2" data-mobile-menu>
        <a href="/profile/view" class="btn btn-outline-secondary">Назад в профиль</a>
        <a href="/main/view" class="btn btn-outline-secondary">На главную</a>
      </div>
    </div>

    <div id="result" class="mb-3" role="status"></div>

    <section class="card shadow-sm">
      <div class="card-body">
        <form id="add-book-form" class="row g-3">
          <div class="col-12 col-md-6">
            <label for="title" class="form-label">Название книги</label>
            <input id="title" type="text" class="form-control" required>
          </div>
          <div class="col-12 col-md-6">
            <label for="author-fullname" class="form-label">Автор (fullname)</label>
            <input id="author-fullname" type="text" class="form-control" required>
          </div>
          <div class="col-12">
            <label for="exchange-point" class="form-label">Адрес размещения книги</label>
            <select id="exchange-point" class="form-select" required></select>
          </div>
          <div class="col-12 d-flex gap-2">
            <button type="submit" class="btn btn-primary">Отдать</button>
            <button id="reset-btn" type="button" class="btn btn-outline-secondary">Очистить</button>
          </div>
        </form>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container py-4 small muted">
      © Bookcrossing. Читайте, делитесь, возвращайте книги в оборот.
    </div>
  </footer>

  <script src="/static/app.js"></script>
  <script>
    const result = document.getElementById("result");
    const addBookForm = document.getElementById("add-book-form");
    const resetBtn = document.getElementById("reset-btn");
    const exchangePointSelect = document.getElementById("exchange-point");
    let resultTimer;

    function showSideToast(type, message, timeoutMs = 4000) {
      const existingStack = document.getElementById("page-toast-stack");
      const stack = existingStack ?? (() => {
        const element = document.createElement("div");
        element.id = "page-toast-stack";
        Object.assign(element.style, {
          position: "fixed",
          top: ".8rem",
          right: window.innerWidth <= 699 ? ".8rem" : "1rem",
          left: window.innerWidth <= 699 ? ".8rem" : "auto",
          width: window.innerWidth <= 699 ? "auto" : "min(360px, calc(100vw - 2rem))",
          zIndex: "1300",
          display: "flex",
          flexDirection: "column",
          gap: ".75rem",
          pointerEvents: "none",
          transform: "none",
        });
        document.body.appendChild(element);
        return element;
      })();
      const accentColor = {success:"var(--success)",danger:"var(--danger)",warning:"var(--warning)",info:"var(--primary)",secondary:"var(--border-strong)"}[type] || "var(--primary)";
      const iconText = {success:"✓",danger:"!",warning:"•",info:"i",secondary:"•"}[type] || "i";
      const titleText = {success:"Готово",danger:"Ошибка",warning:"Внимание",info:"Сообщение",secondary:"Сообщение"}[type] || "Сообщение";
      const toast = document.createElement("div");
      Object.assign(toast.style, {pointerEvents:"auto",border:"1px solid var(--border)",borderRadius:"16px",background:"color-mix(in srgb, var(--bg-elevated) 92%, transparent)",backdropFilter:"blur(16px)",boxShadow:"0 18px 34px rgba(15, 23, 42, 0.18)",overflow:"hidden",transform:"translateX(24px)",opacity:"0",transition:"transform .22s ease, opacity .22s ease"});
      const body = document.createElement("div");
      Object.assign(body.style, {display:"flex",alignItems:"flex-start",gap:".75rem",padding:".9rem .95rem 1rem",position:"relative"});
      const accent = document.createElement("div");
      Object.assign(accent.style, {position:"absolute",top:"0",left:"0",right:"0",height:"3px",background:accentColor});
      const icon = document.createElement("div");
      icon.textContent = iconText;
      Object.assign(icon.style, {width:"2rem",height:"2rem",borderRadius:"999px",display:"inline-flex",alignItems:"center",justifyContent:"center",flexShrink:"0",fontSize:".95rem",fontWeight:"800",color:"#fff",background:accentColor});
      const content = document.createElement("div");
      Object.assign(content.style, {minWidth:"0",flex:"1 1 auto"});
      const title = document.createElement("div");
      title.textContent = titleText;
      Object.assign(title.style, {fontSize:".84rem",fontWeight:"700",marginBottom:".18rem",color:"var(--text)"});
      const text = document.createElement("div");
      text.textContent = String(message);
      Object.assign(text.style, {fontSize:".92rem",lineHeight:"1.4",color:"var(--text)",overflowWrap:"anywhere"});
      const close = document.createElement("button");
      close.type = "button";
      close.textContent = "×";
      Object.assign(close.style, {border:"0",background:"transparent",color:"var(--text-muted)",padding:"0",width:"1.5rem",height:"1.5rem",borderRadius:"999px",cursor:"pointer",flexShrink:"0",fontSize:"1rem",lineHeight:"1"});
      function removeToast() { if (!toast.isConnected) return; toast.style.transform = "translateX(24px)"; toast.style.opacity = "0"; setTimeout(() => toast.remove(), 220); }
      close.addEventListener("click", removeToast);
      content.appendChild(title); content.appendChild(text);
      body.appendChild(accent); body.appendChild(icon); body.appendChild(content); body.appendChild(close);
      toast.appendChild(body); stack.appendChild(toast);
      requestAnimationFrame(() => { toast.style.transform = "translateX(0)"; toast.style.opacity = "1"; });
      if (timeoutMs > 0) setTimeout(removeToast, timeoutMs);
    }

    function showResult(type, message, timeoutMs = 4000) {
      showSideToast(type, message, timeoutMs);
    }

    function fillExchangePoints(items) {
      exchangePointSelect.innerHTML = "";
      if (!Array.isArray(items) || items.length === 0) {
        const option = document.createElement("option");
        option.value = "";
        option.textContent = "Нет доступных адресов";
        exchangePointSelect.appendChild(option);
        exchangePointSelect.disabled = true;
        return;
      }

      exchangePointSelect.disabled = false;
      items.forEach((point) => {
        const option = document.createElement("option");
        option.value = String(point.id);
        option.textContent = point.address ?? "Адрес не указан";
        exchangePointSelect.appendChild(option);
      });
    }

    async function loadContext() {
      try {
        const response = await fetch("/profile/add-book", {
          method: "GET",
          headers: {"Accept": "application/json"}
        });
        const data = await response.json();
        if (!response.ok) {
          showResult("danger", data.detail ? String(data.detail) : "Не удалось загрузить адреса");
          return;
        }
        fillExchangePoints(data.exchanges_point ?? []);
      } catch (error) {
        showResult("danger", "Ошибка загрузки данных");
      }
    }

    addBookForm.addEventListener("submit", async (event) => {
      event.preventDefault();
      const payload = {
        title: document.getElementById("title").value.trim(),
        author_fullname: document.getElementById("author-fullname").value.trim(),
        exchange_point_id: Number(exchangePointSelect.value)
      };

      if (!payload.title || !payload.author_fullname || !payload.exchange_point_id) {
        showResult("danger", "Заполните обязательные поля");
        return;
      }

      try {
        const response = await fetch("/profile/add-book", {
          method: "POST",
          headers: {"Content-Type": "application/json"},
          body: JSON.stringify(payload)
        });
        const data = await response.json();
        if (!response.ok) {
          showResult("danger", data.detail ? String(data.detail) : "Не удалось добавить книгу");
          return;
        }
        showResult("success", "Книга успешно добавлена");
        setTimeout(() => {
          window.location.href = "/profile/view";
        }, 250);
      } catch (error) {
        showResult("danger", "Ошибка запроса");
      }
    });

    resetBtn.addEventListener("click", () => {
      addBookForm.reset();
    });

    loadContext();
  </script>
</body>
</html>
