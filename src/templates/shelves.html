<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Адреса полок</title>
  <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
  <link rel="stylesheet" href="/static/app.css">
  <style>
    body {
      min-height: 100vh;
    }
    .site-footer {
      background: var(--bg-solid);
      border-top: 1px solid var(--border);
      color: var(--text-muted);
    }
    .site-footer .muted {
      color: var(--text-muted);
    }
    #list > [class*="col-"] {
      margin-bottom: .55rem;
    }
  </style>
</head>
<body class="bg-light d-flex flex-column">
  <main class="container py-4 py-md-5 flex-grow-1 d-flex flex-column">
    <div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-2">
      <h1 class="h3 mb-0">Все адреса полок</h1>
      <a href="/main/view" class="btn btn-outline-secondary">На главную</a>
    </div>

    <form id="search-form" class="card shadow-sm mb-4">
      <div class="card-body">
        <label for="q" class="form-label">Поиск по организации или адресу</label>
        <div class="d-flex gap-2 flex-wrap">
          <input id="q" type="text" class="form-control" placeholder="Введите название или адрес">
          <button type="submit" class="btn btn-primary">Искать</button>
          <button id="clear-btn" type="button" class="btn btn-outline-secondary">Сбросить</button>
        </div>
      </div>
    </form>

    <div id="result" class="mb-3" role="status"></div>
    <div id="empty" class="alert alert-secondary d-none">Адреса не найдены</div>
    <div id="list" class="row g-3"></div>
    <div class="mt-4">
      <nav aria-label="Пагинация" class="mt-auto pt-1">
        <ul id="pagination" class="pagination justify-content-center mb-0"></ul>
        <div id="pagination-status" class="small text-muted text-center mt-2"></div>
      </nav>
    </div>
  </main>

  <footer class="site-footer">
    <div class="container py-4 small muted">
      © Bookcrossing. Читайте, делитесь, возвращайте книги в оборот.
    </div>
  </footer>

  <script src="/static/app.js"></script>
  <script>
    const searchForm = document.getElementById("search-form");
    const clearBtn = document.getElementById("clear-btn");
    const qInput = document.getElementById("q");
    const result = document.getElementById("result");
    const empty = document.getElementById("empty");
    const list = document.getElementById("list");
    const pagination = document.getElementById("pagination");
    const paginationStatus = document.getElementById("pagination-status");
    let resultTimer;
    let currentPage = 1;
    let totalPages = 0;

    function showSideToast(type, message, timeoutMs = 3500) {
      const existingStack = document.getElementById("page-toast-stack");
      const stack = existingStack ?? (() => {
        const element = document.createElement("div");
        element.id = "page-toast-stack";
        Object.assign(element.style, {
          position: "fixed",
          top: ".8rem",
          right: window.innerWidth <= 699 ? ".8rem" : "1rem",
          left: window.innerWidth <= 699 ? ".8rem" : "auto",
          width: window.innerWidth <= 699 ? "auto" : "min(360px, calc(100vw - 2rem))",
          zIndex: "1300",
          display: "flex",
          flexDirection: "column",
          gap: ".75rem",
          pointerEvents: "none",
          transform: "none",
        });
        document.body.appendChild(element);
        return element;
      })();
      const accentColor = {success:"var(--success)",danger:"var(--danger)",warning:"var(--warning)",info:"var(--primary)",secondary:"var(--border-strong)"}[type] || "var(--primary)";
      const iconText = {success:"✓",danger:"!",warning:"•",info:"i",secondary:"•"}[type] || "i";
      const titleText = {success:"Готово",danger:"Ошибка",warning:"Внимание",info:"Сообщение",secondary:"Сообщение"}[type] || "Сообщение";
      const toast = document.createElement("div");
      Object.assign(toast.style, {pointerEvents:"auto",border:"1px solid var(--border)",borderRadius:"16px",background:"color-mix(in srgb, var(--bg-elevated) 92%, transparent)",backdropFilter:"blur(16px)",boxShadow:"0 18px 34px rgba(15, 23, 42, 0.18)",overflow:"hidden",transform:"translateX(24px)",opacity:"0",transition:"transform .22s ease, opacity .22s ease"});
      const body = document.createElement("div");
      Object.assign(body.style, {display:"flex",alignItems:"flex-start",gap:".75rem",padding:".9rem .95rem 1rem",position:"relative"});
      const accent = document.createElement("div");
      Object.assign(accent.style, {position:"absolute",top:"0",left:"0",right:"0",height:"3px",background:accentColor});
      const icon = document.createElement("div");
      icon.textContent = iconText;
      Object.assign(icon.style, {width:"2rem",height:"2rem",borderRadius:"999px",display:"inline-flex",alignItems:"center",justifyContent:"center",flexShrink:"0",fontSize:".95rem",fontWeight:"800",color:"#fff",background:accentColor});
      const content = document.createElement("div");
      Object.assign(content.style, {minWidth:"0",flex:"1 1 auto"});
      const title = document.createElement("div");
      title.textContent = titleText;
      Object.assign(title.style, {fontSize:".84rem",fontWeight:"700",marginBottom:".18rem",color:"var(--text)"});
      const text = document.createElement("div");
      text.textContent = String(message);
      Object.assign(text.style, {fontSize:".92rem",lineHeight:"1.4",color:"var(--text)",overflowWrap:"anywhere"});
      const close = document.createElement("button");
      close.type = "button";
      close.textContent = "×";
      Object.assign(close.style, {border:"0",background:"transparent",color:"var(--text-muted)",padding:"0",width:"1.5rem",height:"1.5rem",borderRadius:"999px",cursor:"pointer",flexShrink:"0",fontSize:"1rem",lineHeight:"1"});
      function removeToast() { if (!toast.isConnected) return; toast.style.transform = "translateX(24px)"; toast.style.opacity = "0"; setTimeout(() => toast.remove(), 220); }
      close.addEventListener("click", removeToast);
      content.appendChild(title); content.appendChild(text);
      body.appendChild(accent); body.appendChild(icon); body.appendChild(content); body.appendChild(close);
      toast.appendChild(body); stack.appendChild(toast);
      requestAnimationFrame(() => { toast.style.transform = "translateX(0)"; toast.style.opacity = "1"; });
      if (timeoutMs > 0) setTimeout(removeToast, timeoutMs);
    }

    function showResult(type, message, timeoutMs = 3500) {
      showSideToast(type, message, timeoutMs);
    }

    function buildCatalogLink(address) {
      const params = new URLSearchParams();
      params.set("address", address);
      return `/book/catalog/view?${params.toString()}`;
    }

    function renderItems(items) {
      if (!Array.isArray(items) || items.length === 0) {
        empty.classList.remove("d-none");
        list.innerHTML = "";
        pagination.innerHTML = "";
        paginationStatus.textContent = "";
        return;
      }

      empty.classList.add("d-none");
      list.innerHTML = items.map((item) => `
        <div class="col-12 col-md-6 col-lg-4">
          <article class="card h-100 shadow-sm">
            <div class="card-body">
              <h2 class="h6">${item.name ?? "-"}</h2>
              <p class="mb-2">
                <a href="${buildCatalogLink(item.address ?? "")}" class="link-primary text-decoration-none">
                  ${item.address ?? "-"}
                </a>
              </p>
              <p class="mb-0 text-muted">${item.description ?? ""}</p>
            </div>
          </article>
        </div>
      `).join("");
    }

    function renderPagination() {
      if (!totalPages || totalPages <= 0) {
        pagination.innerHTML = "";
        paginationStatus.textContent = "";
        return;
      }

      const prevDisabled = currentPage <= 1 ? "disabled" : "";
      const nextDisabled = currentPage >= totalPages ? "disabled" : "";
      paginationStatus.textContent = `Страница ${currentPage} из ${totalPages}`;

      pagination.innerHTML = `
        <li class="page-item ${prevDisabled}">
          <button class="page-link" data-page="${currentPage - 1}">Назад</button>
        </li>
        <li class="page-item disabled">
          <span class="page-link">${currentPage}</span>
        </li>
        <li class="page-item ${nextDisabled}">
          <button class="page-link" data-page="${currentPage + 1}">Вперед</button>
        </li>
      `;

      pagination.querySelectorAll("button[data-page]").forEach((button) => {
        button.addEventListener("click", () => {
          const nextPage = Number(button.dataset.page);
          if (!nextPage || nextPage < 1 || nextPage > totalPages || nextPage === currentPage) {
            return;
          }
          window.scrollTo({ top: 0, behavior: "smooth" });
          loadItems(nextPage);
        });
      });
    }

    async function loadItems(page = 1) {
      try {
        const params = new URLSearchParams();
        params.set("page", String(page));
        const q = qInput.value.trim();
        if (q) {
          params.set("q", q);
        }
        const response = await fetch(`/main/shelves?${params.toString()}`, {
          method: "GET",
          headers: {"Accept": "application/json"}
        });
        const data = await response.json();
        if (!response.ok) {
          showResult("danger", data.detail ? String(data.detail) : "Не удалось загрузить адреса");
          return;
        }
        currentPage = data.page ?? 1;
        totalPages = data.total_pages ?? 0;
        renderItems(data.items ?? []);
        renderPagination();
      } catch (error) {
        showResult("danger", "Ошибка загрузки адресов");
      }
    }

    searchForm.addEventListener("submit", (event) => {
      event.preventDefault();
      loadItems(1);
    });

    clearBtn.addEventListener("click", () => {
      qInput.value = "";
      loadItems(1);
    });

    loadItems(1);
  </script>
</body>
</html>
