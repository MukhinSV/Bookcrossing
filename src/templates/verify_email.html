<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Подтверждение Email</title>
  <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
  <link rel="stylesheet" href="/static/app.css">
  <style>
    body {
      min-height: 100vh;
      background: var(--bg);
    }
    .top-link {
      color: var(--text-muted);
      font-weight: 500;
    }
    .auth-card {
      border: 1px solid var(--border);
      border-radius: 1.25rem;
      background: color-mix(in srgb, var(--surface) 90%, transparent);
      backdrop-filter: blur(18px);
      box-shadow: var(--shadow);
    }
    .code-input {
      text-align: center;
      font-size: 1.2rem;
      letter-spacing: .45rem;
      font-weight: 700;
    }
  </style>
</head>
<body class="bg-light">
  <main class="container py-5">
    <div class="row justify-content-center">
      <div class="col-12 col-md-8 col-lg-5">
        <div class="card auth-card">
          <div class="card-body p-4">
            <div class="mb-3">
              <a href="/auth/login" class="text-decoration-none top-link">← Ко входу</a>
            </div>
            <h1 class="h4 mb-3">Подтверждение Email</h1>
            <p class="text-muted mb-3">
              Мы отправили 4-значный код на почту:
              <strong id="email-value">—</strong>
            </p>

            <form id="verify-form" class="vstack gap-3">
              <div>
                <label for="code" class="form-label">Код из письма</label>
                <input id="code" type="text" class="form-control code-input" inputmode="numeric" maxlength="4" required>
              </div>
              <button type="submit" class="btn btn-primary">Подтвердить</button>
              <button id="resend-btn" type="button" class="btn btn-outline-secondary">Отправить код повторно</button>
            </form>

            <div id="result" class="mt-3" role="status"></div>
          </div>
        </div>
      </div>
    </div>
  </main>

  <script src="/static/app.js"></script>
  <script>
    const form = document.getElementById("verify-form");
    const resendBtn = document.getElementById("resend-btn");
    const codeInput = document.getElementById("code");
    const result = document.getElementById("result");
    const emailValue = document.getElementById("email-value");
    const email = new URLSearchParams(window.location.search).get("email") || "";
    let resultTimer;

    emailValue.textContent = email || "—";

    function showResult(type, message, timeoutMs = 4000) {
      const existingStack = document.getElementById("page-toast-stack");
      const stack = existingStack ?? (() => {
        const element = document.createElement("div");
        element.id = "page-toast-stack";
        Object.assign(element.style, {position:"fixed",top:".8rem",right:window.innerWidth<=699?".8rem":"1rem",left:window.innerWidth<=699?".8rem":"auto",width:window.innerWidth<=699?"auto":"min(360px, calc(100vw - 2rem))",zIndex:"1300",display:"flex",flexDirection:"column",gap:".75rem",pointerEvents:"none",transform:"none"});
        document.body.appendChild(element);
        return element;
      })();
      const accentColor = {success:"var(--success)",danger:"var(--danger)",warning:"var(--warning)",info:"var(--primary)",secondary:"var(--border-strong)"}[type] || "var(--primary)";
      const iconText = {success:"✓",danger:"!",warning:"•",info:"i",secondary:"•"}[type] || "i";
      const titleText = {success:"Готово",danger:"Ошибка",warning:"Внимание",info:"Сообщение",secondary:"Сообщение"}[type] || "Сообщение";
      const toast = document.createElement("div");
      Object.assign(toast.style, {pointerEvents:"auto",border:"1px solid var(--border)",borderRadius:"16px",background:"color-mix(in srgb, var(--bg-elevated) 92%, transparent)",backdropFilter:"blur(16px)",boxShadow:"0 18px 34px rgba(15, 23, 42, 0.18)",overflow:"hidden",transform:"translateX(24px)",opacity:"0",transition:"transform .22s ease, opacity .22s ease"});
      const body = document.createElement("div");
      Object.assign(body.style, {display:"flex",alignItems:"flex-start",gap:".75rem",padding:".9rem .95rem 1rem",position:"relative"});
      const accent = document.createElement("div");
      Object.assign(accent.style, {position:"absolute",top:"0",left:"0",right:"0",height:"3px",background:accentColor});
      const icon = document.createElement("div");
      icon.textContent = iconText;
      Object.assign(icon.style, {width:"2rem",height:"2rem",borderRadius:"999px",display:"inline-flex",alignItems:"center",justifyContent:"center",flexShrink:"0",fontSize:".95rem",fontWeight:"800",color:"#fff",background:accentColor});
      const content = document.createElement("div");
      Object.assign(content.style, {minWidth:"0",flex:"1 1 auto"});
      const title = document.createElement("div");
      title.textContent = titleText;
      Object.assign(title.style, {fontSize:".84rem",fontWeight:"700",marginBottom:".18rem",color:"var(--text)"});
      const text = document.createElement("div");
      text.textContent = String(message);
      Object.assign(text.style, {fontSize:".92rem",lineHeight:"1.4",color:"var(--text)",overflowWrap:"anywhere"});
      const close = document.createElement("button");
      close.type = "button";
      close.textContent = "×";
      Object.assign(close.style, {border:"0",background:"transparent",color:"var(--text-muted)",padding:"0",width:"1.5rem",height:"1.5rem",borderRadius:"999px",cursor:"pointer",flexShrink:"0",fontSize:"1rem",lineHeight:"1"});
      function removeToast() { if (!toast.isConnected) return; toast.style.transform = "translateX(24px)"; toast.style.opacity = "0"; setTimeout(() => toast.remove(), 220); }
      close.addEventListener("click", removeToast);
      content.appendChild(title); content.appendChild(text);
      body.appendChild(accent); body.appendChild(icon); body.appendChild(content); body.appendChild(close);
      toast.appendChild(body); stack.appendChild(toast);
      requestAnimationFrame(() => { toast.style.transform = "translateX(0)"; toast.style.opacity = "1"; });
      if (timeoutMs > 0) setTimeout(removeToast, timeoutMs);
    }

    codeInput.addEventListener("input", () => {
      codeInput.value = codeInput.value.replace(/\D/g, "").slice(0, 4);
    });

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      if (!email) {
        showResult("danger", "Email не передан");
        return;
      }
      const code = codeInput.value.trim();
      if (code.length !== 4) {
        showResult("danger", "Введите 4 цифры кода");
        return;
      }

      const response = await fetch("/auth/verify-email", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({email, code})
      });
      const data = await response.json();
      if (!response.ok) {
        showResult("danger", data.detail ? String(data.detail) : "Не удалось подтвердить email");
        return;
      }
      showResult("success", "Email подтвержден");
      setTimeout(() => {
        window.location.href = "/";
      }, 600);
    });

    resendBtn.addEventListener("click", async () => {
      if (!email) {
        showResult("danger", "Email не передан");
        return;
      }
      const response = await fetch("/auth/verify-email/resend", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({email})
      });
      const data = await response.json();
      if (!response.ok) {
        showResult("danger", data.detail ? String(data.detail) : "Не удалось отправить код");
        return;
      }
      showResult("success", data.detail ? String(data.detail) : "Код отправлен повторно");
    });
  </script>
</body>
</html>
