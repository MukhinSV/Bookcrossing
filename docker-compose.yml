services:
  db:
    image: postgres:16-alpine
    container_name: bookcrossing-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: bookcrossing
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: root
    volumes:
      - postgres_data_app:/var/lib/postgresql/data
    ports:
      - "6432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d bookcrossing"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    container_name: bookcrossing-redis
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bookcrossing-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://postgres:root@db:5432/bookcrossing
      REDIS_URL: redis://redis:6379
    ports:
      - "8000:8000"
    volumes:
      - ./src/imgs:/app/src/imgs

volumes:
  postgres_data_app:
